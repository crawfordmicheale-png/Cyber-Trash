<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- user-scalable=no stops double-tap zoom mid-fight; viewport-fit=cover fills
     the notch area on phones. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05050a">
<!-- "Add to Home Screen" then launches without browser chrome, which is the
     only reliable way to get fullscreen on iOS. -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CYBER-TRASH">
<title>CYBER-TRASH</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #05050a;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: #6a6a80;
    /* No scrolling, no pull-to-refresh, no rubber-banding, no tap flash. */
    position: fixed; inset: 0;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }
  #stage {
    position: fixed; inset: 0;
    display: grid; place-items: center;
    background:
      radial-gradient(120% 90% at 50% 40%, #14101c 0%, #05050a 70%);
  }
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    display: block;
    box-shadow: 0 0 0 1px #1b1b28, 0 0 90px -10px rgba(255, 45, 149, 0.35),
                0 0 140px -20px rgba(0, 240, 255, 0.25);
    touch-action: none;
  }
  #boot {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: #05050a; z-index: 10; cursor: pointer;
    text-align: center; letter-spacing: 0.18em; font-size: 13px;
    padding: 16px;
    touch-action: manipulation;
  }
  #boot b { display: block; font-size: 30px; letter-spacing: 0.24em; margin-bottom: 14px;
    color: #ff2d95; text-shadow: 0 0 18px rgba(255,45,149,.75), 2px 2px 0 #00f0ff; }
  #boot span { color: #b6ff2e; }
  #boot small { display:block; margin-top: 22px; color:#4a4a5e; letter-spacing:.1em; line-height:1.9; }
  /* Swap the control hints depending on what the device actually has. */
  .touch-only { display: none; }
  @media (pointer: coarse) {
    .touch-only { display: block; }
    .keys-only { display: none; }
    #boot b { font-size: 24px; }
  }
  #boot .build { display: block; margin-top: 16px; color: #23232e; font-size: 10px; letter-spacing: .2em; }
  #boot .fail b { color: #ff3355; text-shadow: 0 0 18px rgba(255,51,85,.7); }
  #boot .fail .why { display: block; color: #ffe74c; letter-spacing: .08em;
    font-size: 12px; margin-bottom: 14px; word-break: break-word; }
  #boot .fail .fix { display: block; color: #6a6a80; letter-spacing: .06em;
    font-size: 11px; line-height: 1.8; word-break: break-word; }
</style>
</head>
<body>
  <div id="stage"></div>
  <div id="boot">
    <div>
      <b>CYBER-TRASH</b>
      <span class="keys-only">[ CLICK TO DESCEND ]</span>
      <span class="touch-only">[ TAP TO DESCEND ]</span>
      <small class="keys-only">
        MOVE &nbsp;A / D &nbsp;&nbsp;·&nbsp;&nbsp; JUMP &nbsp;SPACE &nbsp;&nbsp;·&nbsp;&nbsp; DASH &nbsp;SHIFT<br>
        ATTACK &nbsp;J / LMB &nbsp;&nbsp;·&nbsp;&nbsp; THROW &nbsp;K &nbsp;&nbsp;·&nbsp;&nbsp; WORKBENCH &nbsp;TAB
      </small>
      <small class="touch-only">
        HOLD YOUR PHONE IN LANDSCAPE<br>
        ON-SCREEN CONTROLS APPEAR ONCE YOU START
      </small>
      <span class="build">BUILD __BUILD__</span>
    </div>
  </div>
  <!--
    Boot watchdog. Deliberately plain ES5 and outside the bundle, so it still
    runs when the bundle itself is the thing that is broken.

    Without this, any failure to load or evaluate bundle.js leaves the boot
    screen sitting there with a working-looking "TAP TO DESCEND" that does
    nothing, because the tap handler lives in the code that never ran. This
    turns that silence into a message you can read on the phone.
  -->
  <script>
  (function () {
    var boot = document.getElementById('boot');
    var reported = false;

    function report(why, fix) {
      if (reported || !boot) return;
      reported = true;
      boot.innerHTML =
        '<div class="fail"><b>FAILED TO BOOT</b>' +
        '<span class="why"></span><span class="fix"></span></div>';
      boot.querySelector('.why').textContent = String(why).slice(0, 300);
      boot.querySelector('.fix').textContent = fix;
    }

    // Capture phase catches resource load failures (a missing bundle.js) as
    // well as ordinary script errors.
    window.addEventListener('error', function (e) {
      if (e.target && e.target !== window && e.target.tagName === 'SCRIPT') {
        report('bundle.js failed to load', 'Run "npm run build" (or "npm run dev") and reload.');
        return;
      }
      var msg = (e.error && e.error.message) || e.message || 'script error';
      report(msg, 'This browser could not run the game code. Try an up-to-date browser.');
    }, true);

    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      report((r && r.message) || r || 'unhandled rejection', 'Reload, and report this message.');
    });

    setTimeout(function () {
      if (!window.__cyberTrashReady) {
        report('the game code never started',
          'bundle.js is missing, blocked, or too new for this browser.');
      }
    }, 5000);
  })();
  </script>
  <script type="module" src="./bundle.js"></script>
  <!-- A browser with no ES-module support skips the tag above entirely. -->
  <script nomodule>
    document.getElementById('boot').innerHTML =
      '<div class="fail"><b>FAILED TO BOOT</b>' +
      '<span class="why">this browser does not support javascript modules</span>' +
      '<span class="fix">CYBER-TRASH needs a browser from 2018 or later.</span></div>';
  </script>
</body>
</html>
